<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supporto Tecnico - STEM</title>
  <!-- Icone e installazione sul telefono -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="app/img/icone/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="app/img/icone/icona-192.png">
  <link rel="apple-touch-icon" href="app/img/icone/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Supporto STEM">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="menu-btn" aria-label="Apri elenco prodotti">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a href="#/" class="marchio">
      <img src="app/img/logo-stem.png" alt="STEM" class="logo">
      <span id="appTitle" class="app-nome">Supporto Tecnico - STEM</span>
    </a>
    <div id="lingue" class="lingue" role="group" aria-label="Lingua / Langue"></div>
    <label class="cerca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="cerca" type="search" placeholder="Cerca in tutti i prodotti…" autocomplete="off" aria-label="Cerca">
    </label>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Prodotti">
      <div class="sidebar-head" id="sidebarTitolo">Prodotti <span id="contaProdotti" class="badge">0</span></div>
      <ul id="elencoProdotti"></ul>
    </nav>
    <main id="contenuto" class="contenuto"></main>
  </div>

  <script src="app/config.js"></script>
  <script src="prodotti/elenco.js"></script>
  <script src="pdf/elenco.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
